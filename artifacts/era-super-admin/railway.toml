[build]
buildCommand = "cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @workspace/era-super-admin run build && npm install -g serve"

[deploy]
startCommand = "serve -s dist/public --listen $PORT"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
