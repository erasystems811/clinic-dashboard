openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Era Patient - Hospital Patient Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: patients
  - name: pipeline
  - name: appointments
  - name: dashboard
  - name: activity
  - name: queue
  - name: call-tasks
  - name: departments
  - name: feedback
  - name: wellness
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      parameters:
        - name: stage
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [patients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Created patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found
    patch:
      operationId: updatePatient
      tags: [patients]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientUpdate"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
    delete:
      operationId: deletePatient
      tags: [patients]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /patients/{id}/history:
    get:
      operationId: getPatientHistory
      tags: [patients]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient full history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientHistory"
        "404":
          description: Not found

  /patients/{id}/checkin:
    post:
      operationId: checkinPatient
      tags: [patients]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}/dequeue:
    post:
      operationId: dequeuePatient
      tags: [patients]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient dequeued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}/treatment-plan:
    post:
      operationId: logTreatmentPlan
      tags: [patients]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreatmentPlanInput"
      responses:
        "200":
          description: Treatment plan logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}/flag-missed:
    post:
      operationId: flagMissedTreatment
      tags: [patients]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagMissedInput"
      responses:
        "200":
          description: Patient flagged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallTask"

  /pipeline/stages:
    get:
      operationId: listPipelineStages
      tags: [pipeline]
      responses:
        "200":
          description: Pipeline stages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineStage"

  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      parameters:
        - name: patientId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Not found

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /queue:
    get:
      operationId: listQueue
      tags: [queue]
      responses:
        "200":
          description: Current queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueEntry"

  /call-tasks:
    get:
      operationId: listCallTasks
      tags: [call-tasks]
      parameters:
        - name: completed
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Call tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallTask"

  /call-tasks/{id}/outcome:
    patch:
      operationId: logCallOutcome
      tags: [call-tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallOutcomeInput"
      responses:
        "200":
          description: Call task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallTask"

  /call-tasks/{id}/action-type:
    patch:
      operationId: updateCallTaskActionType
      tags: [call-tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallTaskActionInput"
      responses:
        "200":
          description: Action type updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallTask"

  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}:
    delete:
      operationId: deleteDepartment
      tags: [departments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /feedback:
    get:
      operationId: listFeedback
      tags: [feedback]
      responses:
        "200":
          description: Feedback list and stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
    post:
      operationId: submitFeedback
      tags: [feedback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEntry"

  /wellness:
    get:
      operationId: listWellnessNewsletters
      tags: [wellness]
      responses:
        "200":
          description: All newsletters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WellnessNewsletter"
    put:
      operationId: upsertWellnessNewsletter
      tags: [wellness]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WellnessNewsletterInput"
      responses:
        "200":
          description: Saved newsletter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellnessNewsletter"

  /wellness/current:
    get:
      operationId: getCurrentWellnessNewsletter
      tags: [wellness]
      responses:
        "200":
          description: Current week newsletter or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WellnessNewsletter"
                  - type: "null"

  /wellness/{id}/send:
    post:
      operationId: markNewsletterSent
      tags: [wellness]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Newsletter marked as sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellnessNewsletter"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Patient:
      type: object
      required: [id, firstName, lastName, stage, email, phone, createdAt]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: ["string", "null"]
        hospitalId:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: string
        whatsappNumber:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        gender:
          type: ["string", "null"]
        stage:
          type: string
        preQueueStage:
          type: ["string", "null"]
        diagnosis:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        nextAppointment:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        treatmentPlan:
          type: ["string", "null"]
        treatmentType:
          type: ["string", "null"]
        medicationTiming:
          type: ["string", "null"]
        treatmentDurationDays:
          type: ["integer", "null"]
        treatmentEndDate:
          type: ["string", "null"]
        checkedInAt:
          type: ["string", "null"]
        treatmentStartedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    PatientInput:
      type: object
      required: [firstName, lastName, email, phone]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
        hospitalId:
          type: string
        email:
          type: string
        phone:
          type: string
        whatsappNumber:
          type: string
        age:
          type: integer
        gender:
          type: string
        stage:
          type: string
        diagnosis:
          type: string
        department:
          type: string
        nextAppointment:
          type: string
        notes:
          type: string

    PatientUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
        hospitalId:
          type: string
        email:
          type: string
        phone:
          type: string
        whatsappNumber:
          type: string
        age:
          type: integer
        gender:
          type: string
        stage:
          type: string
        diagnosis:
          type: string
        department:
          type: string
        nextAppointment:
          type: string
        notes:
          type: string

    PatientHistory:
      type: object
      required: [patient, activity, appointments, callTasks]
      properties:
        patient:
          $ref: "#/components/schemas/Patient"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        appointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        callTasks:
          type: array
          items:
            $ref: "#/components/schemas/CallTask"

    TreatmentPlanInput:
      type: object
      required: [treatmentPlan, treatmentType, treatmentDurationDays]
      properties:
        treatmentPlan:
          type: string
        treatmentType:
          type: string
        medicationTiming:
          type: string
        treatmentDurationDays:
          type: integer
        diagnosis:
          type: string
        department:
          type: string

    FlagMissedInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        actionType:
          type: string
          description: "automated_message | manual_text | manual_call"

    QueueEntry:
      type: object
      required: [id, patientId, patientName, position, addedAt]
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        position:
          type: integer
        addedAt:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        whatsappNumber:
          type: ["string", "null"]
        hospitalId:
          type: ["string", "null"]
        stage:
          type: ["string", "null"]
        appointmentId:
          type: ["integer", "null"]

    CallTask:
      type: object
      required: [id, patientId, patientName, phone, reason, flaggedAt, actionType, taskType]
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        phone:
          type: string
        whatsappNumber:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        reason:
          type: string
        taskType:
          type: string
          description: "follow_up | check_in"
        checkInType:
          type: ["string", "null"]
        actionType:
          type: string
          description: "automated_message | manual_text | manual_call"
        outcome:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        flaggedAt:
          type: string

    CallOutcomeInput:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string

    CallTaskActionInput:
      type: object
      required: [actionType]
      properties:
        actionType:
          type: string
          description: "automated_message | manual_text | manual_call"

    PipelineStage:
      type: object
      required: [id, name, color, count, order]
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        count:
          type: integer
        order:
          type: integer

    Appointment:
      type: object
      required: [id, patientId, patientName, title, scheduledAt, status]
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        title:
          type: string
        scheduledAt:
          type: string
        duration:
          type: integer
        department:
          type: ["string", "null"]
        status:
          type: string

    AppointmentInput:
      type: object
      required: [patientId, title, scheduledAt]
      properties:
        patientId:
          type: integer
        title:
          type: string
        scheduledAt:
          type: string
        duration:
          type: integer
        department:
          type: string

    AppointmentUpdate:
      type: object
      properties:
        status:
          type: string
        scheduledAt:
          type: string
        title:
          type: string
        department:
          type: string

    DashboardSummary:
      type: object
      required: [totalPatients, newPatientsThisMonth, appointmentsToday, appointmentsThisWeek, criticalAlerts, pipelineBreakdown]
      properties:
        totalPatients:
          type: integer
        newPatientsThisMonth:
          type: integer
        appointmentsToday:
          type: integer
        appointmentsThisWeek:
          type: integer
        criticalAlerts:
          type: integer
        pipelineBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStage"
        avgFeedbackRating:
          type: ["number", "null"]
        totalFeedback:
          type: ["integer", "null"]
        wellnessLastSentAt:
          type: ["string", "null"]
        avgWaitMinutes:
          type: ["integer", "null"]

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        patientId:
          type: ["integer", "null"]
        patientName:
          type: ["string", "null"]
        createdAt:
          type: string
        metadata:
          type: ["string", "null"]

    Department:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string

    DepartmentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    FeedbackEntry:
      type: object
      required: [id, rating, submittedAt]
      properties:
        id:
          type: integer
        patientId:
          type: ["integer", "null"]
        patientName:
          type: ["string", "null"]
        rating:
          type: integer
        comment:
          type: ["string", "null"]
        submittedAt:
          type: string

    FeedbackInput:
      type: object
      required: [rating]
      properties:
        patientId:
          type: integer
        patientName:
          type: string
        rating:
          type: integer
        comment:
          type: string

    FeedbackResponse:
      type: object
      required: [entries, avgRating, total]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackEntry"
        avgRating:
          type: number
        total:
          type: integer

    WellnessNewsletter:
      type: object
      required: [id, weekOf, content, updatedAt]
      properties:
        id:
          type: integer
        weekOf:
          type: string
        content:
          type: string
        topic:
          type: ["string", "null"]
        youtubeLink:
          type: ["string", "null"]
        tiktokLink:
          type: ["string", "null"]
        recipientCount:
          type: ["integer", "null"]
        lastSentAt:
          type: ["string", "null"]
        updatedAt:
          type: string

    WellnessNewsletterInput:
      type: object
      required: [content, weekOf]
      properties:
        content:
          type: string
        weekOf:
          type: string
        topic:
          type: string
        youtubeLink:
          type: string
        tiktokLink:
          type: string
