openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Era Patient - Hospital Patient Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: patients
    description: Patient management
  - name: pipeline
    description: Pipeline stage operations
  - name: appointments
    description: Appointment management
  - name: dashboard
    description: Dashboard and summary data
  - name: activity
    description: Activity feed
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List all patients
      parameters:
        - name: stage
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Create a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Created patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get a patient by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found
    patch:
      operationId: updatePatient
      tags: [patients]
      summary: Update a patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientUpdate"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
    delete:
      operationId: deletePatient
      tags: [patients]
      summary: Delete a patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /pipeline/stages:
    get:
      operationId: listPipelineStages
      tags: [pipeline]
      summary: List pipeline stages with patient counts
      responses:
        "200":
          description: Pipeline stages with counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineStage"

  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List all appointments
      parameters:
        - name: patientId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List recent activity
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Patient:
      type: object
      required: [id, firstName, lastName, dateOfBirth, stage, email, phone, createdAt]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
        email:
          type: string
        phone:
          type: string
        stage:
          type: string
        diagnosis:
          type: ["string", "null"]
        doctor:
          type: ["string", "null"]
        nextAppointment:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    PatientInput:
      type: object
      required: [firstName, lastName, dateOfBirth, email, phone, stage]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
        email:
          type: string
        phone:
          type: string
        stage:
          type: string
        diagnosis:
          type: string
        doctor:
          type: string
        nextAppointment:
          type: string
        notes:
          type: string

    PatientUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
        email:
          type: string
        phone:
          type: string
        stage:
          type: string
        diagnosis:
          type: string
        doctor:
          type: string
        nextAppointment:
          type: string
        notes:
          type: string

    PipelineStage:
      type: object
      required: [id, name, color, count, order]
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        count:
          type: integer
        order:
          type: integer

    Appointment:
      type: object
      required: [id, patientId, patientName, title, scheduledAt, status]
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        title:
          type: string
        scheduledAt:
          type: string
        duration:
          type: integer
        doctor:
          type: ["string", "null"]
        status:
          type: string
        notes:
          type: ["string", "null"]

    AppointmentInput:
      type: object
      required: [patientId, title, scheduledAt]
      properties:
        patientId:
          type: integer
        title:
          type: string
        scheduledAt:
          type: string
        duration:
          type: integer
        doctor:
          type: string
        notes:
          type: string

    DashboardSummary:
      type: object
      required: [totalPatients, newPatientsThisMonth, appointmentsToday, appointmentsThisWeek, criticalAlerts, pipelineBreakdown]
      properties:
        totalPatients:
          type: integer
        newPatientsThisMonth:
          type: integer
        appointmentsToday:
          type: integer
        appointmentsThisWeek:
          type: integer
        criticalAlerts:
          type: integer
        pipelineBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStage"

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        patientId:
          type: ["integer", "null"]
        patientName:
          type: ["string", "null"]
        createdAt:
          type: string
        metadata:
          type: ["string", "null"]
