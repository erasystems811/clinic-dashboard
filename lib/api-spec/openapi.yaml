openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Era Patient - Hospital Patient Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: patients
    description: Patient management
  - name: pipeline
    description: Pipeline stage operations
  - name: appointments
    description: Appointment management
  - name: dashboard
    description: Dashboard and summary data
  - name: activity
    description: Activity feed
  - name: queue
    description: Queue management
  - name: call-tasks
    description: Call task management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List all patients
      parameters:
        - name: stage
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Create a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Created patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get a patient by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found
    patch:
      operationId: updatePatient
      tags: [patients]
      summary: Update a patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientUpdate"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
    delete:
      operationId: deletePatient
      tags: [patients]
      summary: Delete a patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /patients/{id}/checkin:
    post:
      operationId: checkinPatient
      tags: [patients]
      summary: Receptionist checks patient in — moves to Queued and adds to queue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found

  /patients/{id}/dequeue:
    post:
      operationId: dequeuePatient
      tags: [patients]
      summary: Receptionist removes patient from queue — restores pre-queue stage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient dequeued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found

  /patients/{id}/treatment-plan:
    post:
      operationId: logTreatmentPlan
      tags: [patients]
      summary: Nurse logs treatment plan — moves patient to In Care and starts reminders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreatmentPlanInput"
      responses:
        "200":
          description: Treatment plan logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found

  /patients/{id}/flag-missed:
    post:
      operationId: flagMissedTreatment
      tags: [patients]
      summary: Nurse flags patient for missed treatment — creates call task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagMissedInput"
      responses:
        "200":
          description: Patient flagged, call task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallTask"
        "404":
          description: Not found

  /pipeline/stages:
    get:
      operationId: listPipelineStages
      tags: [pipeline]
      summary: List pipeline stages with patient counts
      responses:
        "200":
          description: Pipeline stages with counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineStage"

  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments (excludes completed by default)
      parameters:
        - name: patientId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update appointment status (no_show, completed, rescheduled, scheduled)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Not found

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List recent activity
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /queue:
    get:
      operationId: listQueue
      tags: [queue]
      summary: Get current queue ordered by position
      responses:
        "200":
          description: Current queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueEntry"

  /call-tasks:
    get:
      operationId: listCallTasks
      tags: [call-tasks]
      summary: List open call tasks
      parameters:
        - name: completed
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Call tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallTask"

  /call-tasks/{id}/outcome:
    patch:
      operationId: logCallOutcome
      tags: [call-tasks]
      summary: Log outcome for a call task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallOutcomeInput"
      responses:
        "200":
          description: Call task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallTask"
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Patient:
      type: object
      required: [id, firstName, lastName, stage, email, phone, createdAt]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: ["string", "null"]
        nationalId:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: string
        whatsappNumber:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        gender:
          type: ["string", "null"]
        stage:
          type: string
          description: "Booked | Queued | In Care | Post Treatment | Post Care | Dormant"
        preQueueStage:
          type: ["string", "null"]
        diagnosis:
          type: ["string", "null"]
        doctor:
          type: ["string", "null"]
        nextAppointment:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        treatmentPlan:
          type: ["string", "null"]
        treatmentType:
          type: ["string", "null"]
        medicationTiming:
          type: ["string", "null"]
        treatmentDurationDays:
          type: ["integer", "null"]
        treatmentEndDate:
          type: ["string", "null"]
        checkedInAt:
          type: ["string", "null"]
        treatmentStartedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    PatientInput:
      type: object
      required: [firstName, lastName, email, phone]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
        nationalId:
          type: string
        email:
          type: string
        phone:
          type: string
        whatsappNumber:
          type: string
        age:
          type: integer
        gender:
          type: string
        stage:
          type: string
        diagnosis:
          type: string
        doctor:
          type: string
        nextAppointment:
          type: string
        notes:
          type: string

    PatientUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
        nationalId:
          type: string
        email:
          type: string
        phone:
          type: string
        whatsappNumber:
          type: string
        age:
          type: integer
        gender:
          type: string
        stage:
          type: string
        diagnosis:
          type: string
        doctor:
          type: string
        nextAppointment:
          type: string
        notes:
          type: string

    TreatmentPlanInput:
      type: object
      required: [treatmentPlan, treatmentType, treatmentDurationDays]
      properties:
        treatmentPlan:
          type: string
          description: Free-text summary of the treatment plan
        treatmentType:
          type: string
          description: "medication | injection | dressing | monitoring | physical_therapy | combination"
        medicationTiming:
          type: string
          description: "Comma-separated timing slots: morning,afternoon,evening,night"
        treatmentDurationDays:
          type: integer
          description: Duration of treatment in days
        diagnosis:
          type: string
        doctor:
          type: string

    FlagMissedInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    QueueEntry:
      type: object
      required: [id, patientId, patientName, position, addedAt]
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        position:
          type: integer
        addedAt:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        stage:
          type: ["string", "null"]

    CallTask:
      type: object
      required: [id, patientId, patientName, phone, reason, flaggedAt]
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        phone:
          type: string
        reason:
          type: string
        outcome:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        flaggedAt:
          type: string

    CallOutcomeInput:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string

    PipelineStage:
      type: object
      required: [id, name, color, count, order]
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        count:
          type: integer
        order:
          type: integer

    Appointment:
      type: object
      required: [id, patientId, patientName, title, scheduledAt, status]
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        title:
          type: string
        scheduledAt:
          type: string
        duration:
          type: integer
        doctor:
          type: ["string", "null"]
        status:
          type: string
        notes:
          type: ["string", "null"]

    AppointmentInput:
      type: object
      required: [patientId, title, scheduledAt]
      properties:
        patientId:
          type: integer
        title:
          type: string
        scheduledAt:
          type: string
        duration:
          type: integer
        doctor:
          type: string
        notes:
          type: string

    AppointmentUpdate:
      type: object
      properties:
        status:
          type: string
          description: "scheduled | completed | no_show | rescheduled"
        scheduledAt:
          type: string
        title:
          type: string
        doctor:
          type: string
        notes:
          type: string

    DashboardSummary:
      type: object
      required: [totalPatients, newPatientsThisMonth, appointmentsToday, appointmentsThisWeek, criticalAlerts, pipelineBreakdown]
      properties:
        totalPatients:
          type: integer
        newPatientsThisMonth:
          type: integer
        appointmentsToday:
          type: integer
        appointmentsThisWeek:
          type: integer
        criticalAlerts:
          type: integer
        pipelineBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStage"

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        patientId:
          type: ["integer", "null"]
        patientName:
          type: ["string", "null"]
        createdAt:
          type: string
        metadata:
          type: ["string", "null"]
